<!doctype html>
<!-- websocket_server's browser client: open this file directly, no web server needed -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebSocket Echo</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 640px; margin: 2em auto; padding: 0 16px; }
  #log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: 8px; white-space: pre-wrap; }
  .in { color: #06c; } .out { color: #555; } .sys { color: #999; font-style: italic; }
  form { display: flex; gap: 8px; margin-top: 8px; } input { flex: 1; }
</style>
</head>
<body>
<h1>WebSocket Echo</h1>
<p><input id="url" value="ws://127.0.0.1:7001/echo"> <button id="connect">Connect</button></p>
<div id="log"></div>
<form id="send"><input id="text" placeholder="message" autocomplete="off"><button>Send</button></form>
<script>
const log = (cls, text) => {
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = text;
  const box = document.getElementById('log');
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
};

let ws = null;
document.getElementById('connect').onclick = () => {
  if (ws) ws.close();
  ws = new WebSocket(document.getElementById('url').value);
  ws.onopen = () => log('sys', 'connected');
  ws.onmessage = e => log('in', '< ' + e.data);
  ws.onclose = e => log('sys', `closed (${e.code}${e.reason ? ' ' + e.reason : ''})`);
  ws.onerror = () => log('sys', 'error');
};

document.getElementById('send').onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById('text');
  if (!ws || ws.readyState !== WebSocket.OPEN || !input.value) return;
  ws.send(input.value);
  log('out', '> ' + input.value);
  input.value = '';
};
</script>
</body>
</html>
