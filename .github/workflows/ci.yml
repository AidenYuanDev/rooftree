# Builds and tests every push to main and every pull request, in Ubuntu 26.04 (24.04's OpenSSL is too
# old) with PostgreSQL 18 beside it, so the database tests run too:
#  - Release: everything, the C++ tests, then the blog's: lint, typecheck, web tests and build, and the
#    API tests against the server just built
#  - ASan: the C++ tests under the address sanitizer
# Deploy (deploy.yml) asks for a successful run of this on the commit it ships.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            id: release
            cmake: -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARKS=ON
          - name: ASan
            id: asan
            cmake: -DCMAKE_BUILD_TYPE=RelWithDebInfo -DASAN=ON -DEXAMPLES=OFF -DAPPS=OFF

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rooftree_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # tests/rooftree_test.yaml.dist: Database.Test, overridden by the environment
      ROOFTREE_DATABASE_TEST_HOST: postgres
      ROOFTREE_DATABASE_TEST_USER: postgres
      ROOFTREE_DATABASE_TEST_PASSWORD: postgres
      ROOFTREE_DATABASE_TEST_NAME: rooftree_test
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G

    steps:
      - uses: actions/checkout@v7

      - name: Dependencies
        run: .github/scripts/install-deps.sh

      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.id }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.id }}-

      # No precompiled headers: ccache can't cache what uses them
      - name: Configure
        run: cmake -B build -G Ninja ${{ matrix.cmake }} -DUSE_COREPCH=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build && ccache --show-stats

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Blog dependencies
        if: matrix.id == 'release'
        working-directory: apps/blog
        run: pnpm install --frozen-lockfile

      - name: Blog lint, typecheck and web tests
        if: matrix.id == 'release'
        working-directory: apps/blog
        run: pnpm lint && pnpm -C web typecheck && pnpm test:web

      # Prerendering reads the API: against the server just built
      - name: Blog web build
        if: matrix.id == 'release'
        env:
          BLOG_BIN: ${{ github.workspace }}/build/bin/blog
          TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/rooftree_blog_test?sslmode=disable
        run: node .github/scripts/build-web.mjs

      - name: Blog API tests
        if: matrix.id == 'release'
        working-directory: apps/blog
        env:
          BLOG_BIN: ${{ github.workspace }}/build/bin/blog
          TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/rooftree_blog_test?sslmode=disable
        run: pnpm test:api
