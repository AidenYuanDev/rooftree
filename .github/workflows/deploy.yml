# Ships the blog, by hand: Actions -> Deploy -> Run workflow, on main. It waits for a reviewer of the
# production environment, checks that CI passed on the commit, then runs ship.sh like a deploy from a
# workstation (the image builds here, its C++ tests included).
#
# The production environment holds:
#   DEPLOY_HOST         user@host, as given to ship.sh
#   DEPLOY_SSH_KEY      a private key of its own, only for this, in the user's authorized_keys
#   DEPLOY_KNOWN_HOSTS  the host's lines from ssh-keyscan, checked against the host beforehand

name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list -R "$GITHUB_REPOSITORY" -w ci.yml -c "$GITHUB_SHA" -s success --json databaseId -q length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::no successful CI run on $GITHUB_SHA"
            exit 1
          fi

      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Ship
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: apps/blog/deploy/docker/ship.sh "$DEPLOY_HOST"
