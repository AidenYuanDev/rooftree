# Ships the blog once CI has passed on a push to main; Actions -> Deploy -> Run workflow, on main, ships
# main again by hand. It checks that CI passed on the commit, then runs ship.sh like a deploy from a
# workstation, the image taking the server CI built and tested; if CI's copy has expired the image
# builds it. Docker's layers are kept between runs.
#
# The production environment holds:
#   DEPLOY_HOST         user@host, as given to ship.sh
#   DEPLOY_SSH_KEY      a private key of its own, only for this, in the user's authorized_keys
#   DEPLOY_KNOWN_HOSTS  the host's lines from ssh-keyscan, checked against the host beforehand

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A pull request from a fork's main is on a branch called main too: only pushes
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      # After workflow_run, github.sha is main's latest commit, not the one CI passed on
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: CI passed on this commit, and its server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" -w ci.yml -c "$DEPLOY_SHA" -s success --json databaseId -q '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "::error::no successful CI run on $DEPLOY_SHA (a commit of only documentation has none: run CI by hand)"
            exit 1
          fi
          stage=build
          if gh run download "$run" -R "$GITHUB_REPOSITORY" -n blog-server -D prebuilt; then
            chmod 755 prebuilt/blog
            stage=prebuilt
          fi
          echo "BLOG_BINARY_STAGE=$stage" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: docker-layers-${{ env.DEPLOY_SHA }}
          restore-keys: docker-layers-

      - name: Docker builder
        run: docker buildx create --use

      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Ship
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          BLOG_DOCKER_BUILD: >-
            docker buildx build --load --build-arg BLOG_BINARY_STAGE=${{ env.BLOG_BINARY_STAGE }}
            --cache-from type=local,src=${{ runner.temp }}/buildx-cache
            --cache-to type=local,dest=${{ runner.temp }}/buildx-new,mode=max
        run: |
          apps/blog/deploy/docker/ship.sh "$DEPLOY_HOST"
          rm -rf "$RUNNER_TEMP/buildx-cache"
          mv "$RUNNER_TEMP/buildx-new" "$RUNNER_TEMP/buildx-cache"
